<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%BRAND_NAME% – %BRAND_DESCRIPTION%</title>
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <link rel="icon" type="image/png" href="%BRAND_FAVICON%" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#fbf6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#160c0e" media="(prefers-color-scheme: dark)" />

    <!--
      Chạy TRƯỚC khi trang hiển thị để đặt đúng theme, tránh nháy sáng/tối.
      Khóa lưu trữ phải trùng với THEME_STORAGE_KEY trong src/features/theme/theme.ts
    -->
    <script>
      ;(function () {
        try {
          var pref = localStorage.getItem('glowup-theme')
          var dark =
            pref === 'dark' ||
            ((pref === null || pref === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>

    <!-- Font chữ thương hiệu (biến font ở src/styles/tokens.css). Thẻ link tải song song với CSS của trang; display=swap: hiện chữ ngay bằng font hệ thống -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap&subset=vietnamese"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
